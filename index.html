<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Marry Me ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #ff4e8a, #ff7eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Floating Hearts */
.heart {
  position: absolute;
  color: rgba(255,255,255,0.6);
  font-size: 20px;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
  100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}

/* Card */
.card {
  background: linear-gradient(135deg, #ff5f9e, #ff8fc7);
  padding: 40px 30px;
  border-radius: 20px;
  text-align: center;
  color: #fff;
  width: 320px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  z-index: 10;
}

.card h1 {
  font-size: 26px;
  margin-bottom: 25px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
}

button {
  padding: 12px 25px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: 0.3s;
}

#yesBtn {
  background: #fff;
  color: #ff4e8a;
  font-weight: bold;
}

#noBtn {
  background: #ff2e63;
  color: #fff;
  position: relative;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 20;
}

.modal-content {
  background: #fff;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  max-width: 300px;
  animation: pop 0.4s ease;
}

@keyframes pop {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal-content h2 {
  color: #ff4e8a;
  margin-bottom: 15px;
}

.modal-content p {
  color: #444;
  font-size: 15px;
}
</style>
</head>

<body>

<!-- Hearts -->
<script>
for (let i = 0; i < 25; i++) {
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
  heart.style.fontSize = (Math.random() * 20 + 15) + "px";
  document.body.appendChild(heart);
}
</script>

<!-- Card -->
<div class="card">
  <h1>Will You Marry Me? 💍❤️</h1>
  <div class="buttons">
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 😜</button>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2>Thank You My Love ❤️</h2>
    <p>
      Thank you for choosing me as your life partner.  
      I promise to love you, respect you, and stand by you forever 💍✨
    </p>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const modal = document.getElementById("modal");

noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * 200 - 100;
  const y = Math.random() * 200 - 100;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

yesBtn.addEventListener("click", () => {
  modal.style.display = "flex";
});
</script>

</body>
</html>
