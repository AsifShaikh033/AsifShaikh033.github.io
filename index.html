<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wedding Invitation - Asif & AASHMA</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      font-family: 'Poppins', sans-serif;
    }
    .card{
      width: 90%;
      max-width: 420px;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.4);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 28px 22px;
      text-align:center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
    }
    .card:before{
      content:"";
      position:absolute;
      top:-80px;
      left:-80px;
      width:180px;
      height:180px;
      background: rgba(255,255,255,0.35);
      border-radius:50%;
    }
    .card:after{
      content:"";
      position:absolute;
      bottom:-90px;
      right:-90px;
      width:220px;
      height:220px;
      background: rgba(255,255,255,0.25);
      border-radius:50%;
    }
    h1{
      font-family: 'Great Vibes', cursive;
      font-size: 44px;
      color:#b1005c;
      margin: 10px 0;
    }
    .subtitle{
      font-size: 14px;
      letter-spacing: 2px;
      color:#333;
      font-weight:600;
      text-transform: uppercase;
    }
    .names{
      margin-top: 18px;
      font-size: 28px;
      font-weight: 600;
      color:#222;
    }
    .heart{
      font-size: 26px;
      margin: 8px 0;
      color:#ff004c;
      animation: beat 1s infinite;
    }
    @keyframes beat{
      0%,100%{ transform: scale(1); }
      50%{ transform: scale(1.2); }
    }
    .footer{
      margin-top: 18px;
      font-size: 13px;
      color:#222;
      opacity: 0.9;
    }
    .btn{
      margin-top: 20px;
      display:inline-block;
      padding: 10px 18px;
      border-radius: 12px;
      background: #b1005c;
      color:white;
      text-decoration:none;
      font-weight:600;
      box-shadow: 0 10px 20px rgba(177,0,92,0.3);
      transition: 0.3s;
    }
    .btn:hover{
      transform: translateY(-2px);
      background:#8e004a;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="subtitle">Wedding Invitation</div>

    <h1>You’re Invited</h1>

    <div class="names">Asif</div>
    <div class="heart">❤️</div>
    <div class="names">AASHMA</div>

    <div class="footer">
      Join us to celebrate love & togetherness ✨
    </div>

    <a class="btn" href="#" onclick="alert('Welcome to Asif & AASHMA Wedding! ❤️')">
      Open Invitation
    </a>
  </div>

</body>
</html>
