<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Royal Wedding Invitation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Amiri:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#062b1f,#0b3d2e,#0f5132);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Poppins', sans-serif;
  overflow:hidden;
  position:relative;
}

/* Subtle Islamic Pattern */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:url('https://www.transparenttextures.com/patterns/arabesque.png');
  opacity:0.06;
  z-index:0;
}

/* Floating Hearts */
.heart{
  position:fixed;
  bottom:-20px;
  font-size:18px;
  color:#ff4d88;
  animation:floatUp linear infinite;
  opacity:0.7;
  pointer-events:none;
  z-index:0;
}

@keyframes floatUp{
  from{transform:translateY(0) scale(0.8);opacity:0.9;}
  to{transform:translateY(-110vh) scale(1.4);opacity:0;}
}

/* Container */
.card-container{
  position:relative;
  width:90vw;              /* responsive width */
  max-width:380px;         /* desktop limit */
  aspect-ratio: 2 / 3;     /* keeps card proportion */
  max-height:90vh;         /* never exceed screen */
  z-index:2;
  animation:zoomSlow 12s infinite alternate ease-in-out;
}


@keyframes zoomSlow{
  from{transform:scale(1);}
  to{transform:scale(1.05);}
}

/* Card */
.card{
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(circle,#0f5132,#062b1f);
  border-radius:12px;
  padding:30px;
  text-align:center;
  color:#d4af37;
  box-shadow:0 25px 60px rgba(0,0,0,0.6);
  border:3px solid #d4af37;
  opacity:0;
  transform:scale(0.8);
  transition:all 1s ease;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
 overflow:auto;
}

/* Golden shimmer */
.card::after{
  content:"";
  position:absolute;
  top:-100%;
  left:-100%;
  width:200%;
  height:200%;
  background:linear-gradient(120deg,transparent 40%,rgba(255,215,0,0.25) 50%,transparent 60%);
  transform:rotate(25deg);
  animation:shimmer 6s infinite;
}

@keyframes shimmer{
  0%{transform:translateX(-100%) rotate(25deg);}
  100%{transform:translateX(100%) rotate(25deg);}
}

.card.show{
  opacity:1;
  transform:scale(1);
}

.card::before{
  content:"";
  position:absolute;
  inset:10px;
  border:2px solid #d4af37;
  border-radius:8px;
}

/* Typography */
.arabic{
  font-family:'Amiri', serif;
  font-size:25px;
  margin:15px 0;
}

.card h2{
  font-family:'Cinzel', serif;
  font-size:26px;
  margin-bottom:15px;
}

.names{
  font-family:'Great Vibes', cursive;
  font-size:38px;
  margin:20px 0;
}

.details{
  font-size:15px;
  line-height:1.8;
}

.divider{
  width:120px;
  height:2px;
  background:#d4af37;
  margin:20px auto;
}

.logos{
  font-size:26px;
  margin-bottom:10px;
}

/* Countdown */
#countdown{
  margin-top:15px;
  font-size:14px;
  color:#fff;
}

/* Open Button */
/* Premium Open Button */
.start-btn{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:16px 45px;
  border:none;
  border-radius:50px;
  font-size:18px;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
  z-index:3;

  font-family:'Cinzel', serif;
  color:#062b1f;

  background:linear-gradient(45deg,#ffd700,#ffcc00,#ffd700);
  box-shadow:0 8px 25px rgba(255,215,0,0.5);

  transition:all 0.3s ease;
  animation:buttonPulse 2.5s infinite;
}

/* Hover Effect */
.start-btn:hover{
  transform:translate(-50%,-50%) scale(1.08);
  box-shadow:0 12px 35px rgba(255,215,0,0.8);
}

/* Soft Pulse Animation */
@keyframes buttonPulse{
  0%{
    box-shadow:0 0 10px rgba(255,215,0,0.4);
  }
  50%{
    box-shadow:0 0 30px rgba(255,215,0,0.9);
  }
  100%{
    box-shadow:0 0 10px rgba(255,215,0,0.4);
  }
}


/* Music Button */
.music-btn{
  position:fixed;
  top:15px;
  right:15px;
  background:#d4af37;
  border:none;
  border-radius:50%;
  width:40px;
  height:40px;
  cursor:pointer;
  font-size:18px;
}
@media (max-width: 480px){

  .card-container{
    width:92vw;
    max-height:88vh;
  }

  .card{
    padding:20px;
  }

  .names{
    font-size:32px;
  }

  .card h2{
    font-size:22px;
  }

}.nav-buttons{
  position:absolute;
  bottom:-75px;
  width:100%;
  display:flex;
  justify-content:space-between;
  opacity:0;
  transition:0.6s ease;
}

.nav-buttons.show{
  opacity:1;
}

/* Premium Button Style */
.nav-buttons button{
  width:55px;
  height:55px;
  border-radius:50%;
  border:2px solid #d4af37;
  background:linear-gradient(145deg,#ffd700,#b8860b);
  color:#062b1f;
  font-size:22px;
  cursor:pointer;
  box-shadow:
      0 5px 15px rgba(0,0,0,0.4),
      0 0 10px rgba(255,215,0,0.5);
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
}

/* Shine Effect */
.nav-buttons button::after{
  content:"";
  position:absolute;
  top:-100%;
  left:-100%;
  width:200%;
  height:200%;
  background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,0.5) 50%,transparent 60%);
  transform:rotate(25deg);
  transition:0.6s;
}

.nav-buttons button:hover::after{
  transform:translateX(100%) rotate(25deg);
}

/* Hover Animation */
.nav-buttons button:hover{
  transform:scale(1.1);
  box-shadow:
      0 8px 25px rgba(0,0,0,0.6),
      0 0 20px rgba(255,215,0,0.9);
}

/* Press Effect */
.nav-buttons button:active{
  transform:scale(0.95);
}

</style>
</head>

<body>

<!-- Floating Hearts Script -->
<script>
for(let i=0;i<25;i++){
  let heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="💖";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(12+Math.random()*18)+"px";
  heart.style.animationDuration=(5+Math.random()*6)+"s";
  document.body.appendChild(heart);
}
</script>

<div class="card-container">
 <div class="nav-buttons" id="navButtons">
  <button onclick="prevCard()">❮</button>
  <button onclick="nextCard()">❯</button>
</div>


  <!-- Bismillah -->
  <div class="card" id="card1">
    <div class="logos"> 💞  💎  💞 </div>
    <div class="arabic">﷽</div>
    <h2>Bismillahir Rahmanir Raheem</h2>
    <div class="divider"></div>
    <div class="details">
      In the name of Allah,<br>
      The Most Beneficent, The Most Merciful
    </div>
  </div>

  <!-- Haldi -->
  <div class="card" id="card2">
    <div class="logos">💛 🌻 💛</div>
    <h2>Haldi Ceremony</h2>
    <div class="divider"></div>
    <div class="details">
      5 April 2025<br>
      Evening Celebration<br><br>
    </div>
  </div>

  <!-- Nikah -->
  <div class="card" id="card3">
    <div class="logos">🤍 💍 🤍</div>
    <h2>Nikah</h2>
    <div class="divider"></div>
    <div class="names">ER Asif & Asma</div>
    <div class="details">
      6 April 2025 –  2:00 PM<br>
    </div>
    <div id="countdown"></div>
  </div>

  <!-- Walima -->
  <div class="card" id="card4">
    <div class="logos">✨ 🍽 ✨</div>
    <h2>Walima</h2>
    <div class="divider"></div>
    <div class="details">
      7 April 2025<br>
      Reception<br><br>
      Address : Gandharvapuri
    </div>
  </div>

  <button class="start-btn" id="openBtn">✨ Open  Invitation ✨</button>

</div>


<audio id="bgMusic" loop>
  <source src="dhurandhar_rehman.mp3" type="audio/mpeg">
</audio>

<script>
let cards=[
  document.getElementById("card1"),
  document.getElementById("card2"),
  document.getElementById("card3"),
  document.getElementById("card4")
];

let current=0;
let autoMode=true;

/* Open Invitation Click */
document.getElementById("openBtn").onclick=function(){

  this.style.display="none";
  document.getElementById("bgMusic").play();

  openCardsAutomatically();
};

function openCardsAutomatically(){
  if(current < cards.length){
    showOnlyCard(current);
    current++;
    setTimeout(openCardsAutomatically, 3000);
  }else{
    autoMode=false;
    document.getElementById("navButtons").classList.add("show");
  }
}

function showOnlyCard(index){
  cards.forEach(card=>card.classList.remove("show"));
  cards[index].classList.add("show");
}

function nextCard(){
  if(current < cards.length-1){
    current++;
  }else{
    current=0;
  }
  showOnlyCard(current);
}

function prevCard(){
  if(current > 0){
    current--;
  }else{
    current=cards.length-1;
  }
  showOnlyCard(current);
}

/* Countdown */
let weddingDate=new Date("April 6, 2026 00:00:00").getTime();
setInterval(function(){
  let now=new Date().getTime();
  let distance=weddingDate-now;
  let days=Math.floor(distance/(1000*60*60*24));
  if(document.getElementById("countdown"))
    document.getElementById("countdown").innerHTML=
      days+" Days to Nikah 💍";
},1000);
</script>

</body>
</html>
