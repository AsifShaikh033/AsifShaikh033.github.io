<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wedding Invitation - Asif & AASHMA</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box;}
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Poppins', sans-serif;
      background: radial-gradient(circle at top, #ffe2ef, #f7a8c6, #b04cff);
      overflow:hidden;
      padding: 18px;
    }

    /* Floating background glow */
    .bg-glow{
      position:absolute;
      inset:0;
      filter: blur(40px);
      opacity:0.55;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.9), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(255,140,200,0.9), transparent 45%),
        radial-gradient(circle at 40% 90%, rgba(120,90,255,0.9), transparent 45%);
      animation: glowMove 8s ease-in-out infinite alternate;
      z-index:0;
    }
    @keyframes glowMove{
      from{transform: scale(1) translateY(0);}
      to{transform: scale(1.1) translateY(-12px);}
    }

    /* Main card */
    .card{
      position:relative;
      width: 92%;
      max-width: 460px;
      border-radius: 26px;
      padding: 28px 22px;
      text-align:center;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.35);
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 70px rgba(0,0,0,0.22);
      overflow:hidden;
      z-index:2;

      animation: cardPop 1s ease forwards;
      transform: translateY(25px);
      opacity:0;
    }
    @keyframes cardPop{
      to{transform: translateY(0); opacity:1;}
    }

    /* Shimmer effect */
    .card::before{
      content:"";
      position:absolute;
      top:-60%;
      left:-60%;
      width:200%;
      height:200%;
      background: linear-gradient(
        120deg,
        transparent 35%,
        rgba(255,255,255,0.35) 50%,
        transparent 65%
      );
      transform: rotate(18deg);
      animation: shimmer 3.8s linear infinite;
      pointer-events:none;
    }
    @keyframes shimmer{
      from{transform: translateX(-30%) rotate(18deg);}
      to{transform: translateX(30%) rotate(18deg);}
    }

    /* Decorative corner flowers */
    .flower{
      position:absolute;
      width: 120px;
      height: 120px;
      opacity:0.35;
      filter: blur(0.2px);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,0,120,0.25), transparent 65%);
      border-radius: 50%;
    }
    .f1{top:-35px; left:-35px;}
    .f2{bottom:-40px; right:-40px;}

    .subtitle{
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight:700;
      color: rgba(40,40,40,0.85);
      margin-bottom: 10px;
      animation: fadeDown 1.1s ease forwards;
      opacity:0;
      transform: translateY(-10px);
      animation-delay: 0.2s;
    }

    @keyframes fadeDown{
      to{opacity:1; transform: translateY(0);}
    }

    h1{
      font-family: 'Great Vibes', cursive;
      font-size: 50px;
      margin: 8px 0 6px;
      color:#b1005c;
      text-shadow: 0 10px 30px rgba(177,0,92,0.25);
      animation: zoomIn 1.2s ease forwards;
      opacity:0;
      transform: scale(0.9);
      animation-delay: 0.35s;
    }
    @keyframes zoomIn{
      to{opacity:1; transform: scale(1);}
    }

    .names{
      margin-top: 18px;
      font-size: 30px;
      font-weight: 800;
      color:#1c1c1c;
      letter-spacing: 1px;
      animation: fadeUp 1.2s ease forwards;
      opacity:0;
      transform: translateY(14px);
    }
    .names:nth-child(3){ animation-delay: 0.55s; }
    .names:nth-child(5){ animation-delay: 0.75s; }

    @keyframes fadeUp{
      to{opacity:1; transform: translateY(0);}
    }

    .heart{
      font-size: 28px;
      margin: 10px 0;
      color:#ff0055;
      animation: heartBeat 1s infinite;
      filter: drop-shadow(0 10px 20px rgba(255,0,85,0.25));
    }
    @keyframes heartBeat{
      0%,100%{transform: scale(1);}
      50%{transform: scale(1.25);}
    }

    .tagline{
      margin-top: 12px;
      font-size: 14px;
      color: rgba(30,30,30,0.85);
      line-height: 1.5;
      animation: fadeUp 1.2s ease forwards;
      opacity:0;
      transform: translateY(14px);
      animation-delay: 0.95s;
    }

    /* Event boxes */
    .events{
      margin-top: 18px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      animation: fadeUp 1.2s ease forwards;
      opacity:0;
      transform: translateY(14px);
      animation-delay: 1.15s;
    }

    .eventBox{
      padding: 12px 10px;
      border-radius: 18px;
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: inset 0 0 25px rgba(255,255,255,0.12);
    }

    .eventTitle{
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color:#7a0040;
      margin-bottom: 4px;
    }

    .eventDate{
      font-size: 16px;
      font-weight: 800;
      color:#111;
    }

    .eventDay{
      font-size: 12px;
      opacity: 0.8;
      margin-top: 2px;
    }

    /* Button */
    .btn{
      margin-top: 18px;
      display:inline-flex;
      gap:8px;
      align-items:center;
      justify-content:center;
      padding: 12px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #b1005c, #ff2a7a);
      color:white;
      text-decoration:none;
      font-weight:800;
      box-shadow: 0 16px 35px rgba(177,0,92,0.35);
      transition: 0.25s;
      animation: fadeUp 1.2s ease forwards;
      opacity:0;
      transform: translateY(14px);
      animation-delay: 1.35s;
    }
    .btn:hover{
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 22px 50px rgba(177,0,92,0.45);
    }

    /* Floating hearts */
    .heart-float{
      position:absolute;
      bottom:-30px;
      font-size: 18px;
      opacity:0.7;
      animation: floatUp 6s linear infinite;
      z-index:1;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
    }
    @keyframes floatUp{
      0%{transform: translateY(0) translateX(0) scale(1); opacity:0;}
      15%{opacity:0.8;}
      100%{transform: translateY(-110vh) translateX(40px) scale(1.4); opacity:0;}
    }

    /* Small footer */
    .mini{
      margin-top: 12px;
      font-size: 12px;
      opacity: 0.75;
      color:#111;
      animation: fadeUp 1.2s ease forwards;
      opacity:0;
      transform: translateY(14px);
      animation-delay: 1.55s;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Floating hearts (background) -->
  <div class="heart-float" style="left:10%; animation-delay:0s;">❤️</div>
  <div class="heart-float" style="left:25%; animation-delay:1s;">💖</div>
  <div class="heart-float" style="left:45%; animation-delay:2s;">❤️</div>
  <div class="heart-float" style="left:65%; animation-delay:0.7s;">💗</div>
  <div class="heart-float" style="left:82%; animation-delay:1.8s;">❤️</div>
  <div class="heart-float" style="left:92%; animation-delay:2.5s;">💞</div>

  <div class="card">
    <div class="flower f1"></div>
    <div class="flower f2"></div>

    <div class="subtitle">Wedding Invitation</div>
    <h1>You’re Invited</h1>

    <div class="names">Asif</div>
    <div class="heart">❤️</div>
    <div class="names">AASHMA</div>

    <div class="tagline">
      With the blessings of family,<br/>
      we invite you to celebrate our special moments ✨
    </div>

    <div class="events">
      <div class="eventBox">
        <div class="eventTitle">Nikah</div>
        <div class="eventDate">06 April</div>
        <div class="eventDay">Sunday</div>
      </div>

      <div class="eventBox">
        <div class="eventTitle">Walima</div>
        <div class="eventDate">07 April</div>
        <div class="eventDay">Monday</div>
      </div>
    </div>

    <a class="btn" href="#" onclick="alert('Asif ❤️ AASHMA | Nikah: 06 April | Walima: 07 April')">
      ✨ Open Invitation
    </a>

    <div class="mini">Made with love 💕</div>
  </div>

</body>
</html>
